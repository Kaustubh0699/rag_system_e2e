<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Upload Documents</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
  </head>
  <body>
    <main class="container">
      <h1>Upload and Process Documents</h1>
      <p class="subtitle">Session email: <strong>{{ email }}</strong></p>

      <form id="upload-form">
        <label for="file-input" class="file-label">Choose document</label>
        <input id="file-input" type="file" name="file" accept=".pdf,.ppt,.pptx" required />
        <button id="process-button" type="submit">Process Document</button>
      </form>

      <section id="status-section" class="hidden" aria-live="polite">
        <p id="status-message">Waiting...</p>
        <div class="progress-wrapper" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <div id="progress-bar" class="progress-bar"></div>
        </div>
      </section>

      <section id="result" class="result"></section>

      <section class="table-section">
        <h2>Files in This Session</h2>
        <table id="files-table">
          <thead>
            <tr>
              <th>File Name</th>
              <th>Chunks</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="files-body">
            <tr>
              <td colspan="3">No files processed yet.</td>
            </tr>
          </tbody>
        </table>
      </section>
    </main>

    <script src="{{ url_for('static', filename='app.js') }}"></script>
  </body>
</html>
